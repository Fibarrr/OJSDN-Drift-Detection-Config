frr version 10.3.1
frr defaults traditional
hostname r4
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
 ip ospf passive
!
interface eth1
 ip address 10.0.34.2/30
!
interface eth2
 ip address 10.0.45.1/30
!
router ospf
 ospf router-id 10.255.0.4
 network 10.0.34.0/30 area 0.0.0.0
 network 10.0.45.0/30 area 0.0.0.0
 network 10.255.0.4/32 area 0.0.0.0
!
