frr version 10.3.1
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
 ip ospf passive
!
interface eth1
 ip address 10.0.23.2/30
!
interface eth2
 ip address 10.0.34.1/30
!
router ospf
 ospf router-id 10.255.0.3
 network 10.0.23.0/30 area 0.0.0.0
 network 10.0.34.0/30 area 0.0.0.0
 network 10.255.0.3/32 area 0.0.0.0
!
