frr version 10.3.1
frr defaults traditional
hostname r6
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.6/32
 ip ospf passive
!
interface eth1
 ip address 10.0.56.2/30
!
interface eth2
 ip address 10.0.61.1/30
!
router ospf
 ospf router-id 10.255.0.6
 network 10.0.56.0/30 area 0.0.0.0
 network 10.0.61.0/30 area 0.0.0.0
 network 10.255.0.6/32 area 0.0.0.0
!
